[project]
name = "lnurlcash-oracle"
dynamic = ["version"]
description = "A single-oracle Discreet Log Contract (DLC) service for LNURLcash bets - see lnurl-wallet's dlc/betlocker addons."
authors = [{ name = "dni", email = "dni@lnbits.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic-settings>=2.0,<3.0",
  "sqlalchemy>=2.0.0",
  "aiosqlite>=0.20.0",
  "coincurve>=20.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.28.0",
  "ruff>=0.9.0",
  "mypy>=1.13.0",
]

[tool.ruff]
line-length = 120
lint.select = ["E", "F", "I"]

[tool.mypy]
ignore_missing_imports = true
files = "app"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# a fresh `git init` (no tags yet, e.g. right after scaffolding, or any
# shallow/tagless checkout) would otherwise fail hatch-vcs's own
# `git describe` outright - falls back to a clearly-marked placeholder
# instead, same spirit as __init__.py's own LNURLCASH_ORACLE_VERSION
# fallback for a context with no package metadata at all
fallback_version = "0.0.0+unknown"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
